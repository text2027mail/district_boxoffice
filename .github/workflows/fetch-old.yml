name: Historical Data Migration (fetchold.js)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: false
        default: "2025-08-01"
        type: string

      end_date:
        description: "End date (YYYY-MM-DD, blank = today)"
        required: false
        default: ""
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      PRIVATE_REPO: text2027mail/DistrictData2026
      PRIVATE_BRANCH: main
      PAT: ${{ secrets.PRIVATE_REPO_PAT }}

    steps:

      ####################################################
      # Checkout this repository (contains fetchold.js)
      ####################################################

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: code

      ####################################################
      # Verify PAT
      ####################################################

      - name: Verify PAT
        shell: bash
        run: |
          echo "Repository : ${PRIVATE_REPO}"
          if [ -z "$PAT" ]; then
            echo "❌ PAT secret is EMPTY"
            exit 1
          fi
          echo "PAT length: ${#PAT}"

      ####################################################
      # Test GitHub API authentication
      ####################################################

      - name: Test GitHub Authentication
        shell: bash
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${PAT}" \
            https://api.github.com/repos/${PRIVATE_REPO})
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ GitHub authentication failed."
            exit 1
          fi
          echo "✅ Authentication OK"

      ####################################################
      # Clone destination repository
      ####################################################

      - name: Clone Private Repository
        shell: bash
        run: |
          git clone \
            https://x-access-token:${PAT}@github.com/${PRIVATE_REPO}.git \
            data

      ####################################################
      # Setup Node
      ####################################################

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      ####################################################
      # Install packages
      ####################################################

      - name: Install dependencies
        working-directory: code
        run: npm install

      ####################################################
      # Run migration
      ####################################################

      - name: Run fetchold.js
        working-directory: code
        env:
          BOXOFFICE_DIR: ${{ github.workspace }}/data/boxoffice
          ADVANCE_DIR: ${{ github.workspace }}/data/advance
          LOGS_DIR: ${{ github.workspace }}/data/logs
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: node fetchold.js

      ####################################################
      # Commit
      ####################################################

      - name: Commit Changes
        shell: bash
        working-directory: data
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Historical migration"

      ####################################################
      # Push with verbose output
      ####################################################

      - name: Push
        working-directory: data
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          git push \
            --verbose \
            --progress \
            https://x-access-token:${PAT}@github.com/${PRIVATE_REPO}.git \
            HEAD:${PRIVATE_BRANCH}
